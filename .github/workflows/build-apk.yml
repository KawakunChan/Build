name: 🚀 Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag rilis ZIP base (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download ZIP dari Release
        run: |
          wget -q -O project.zip \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag }}/Tr4sflow.Executive.zip"
          echo "✅ Download selesai: $(du -sh project.zip | cut -f1)"

      - name: 📦 Ekstrak Project
        run: |
          mkdir -p project
          unzip -qq project.zip -d project
          echo "✅ File project:"
          ls project/

      - name: 🔧 Fix Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > project/android/local.properties
          echo "✅ SDK path: $ANDROID_HOME"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Install NDK 27 & Android SDK 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            --sdk_root=$ANDROID_HOME 2>&1 | grep -E "Installed|Failed|Warning" || true
          echo "✅ NDK & SDK siap"

      - name: 🐦 Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🩺 Flutter Doctor
        run: flutter doctor -v

      - name: 📚 Flutter Pub Get
        working-directory: project
        run: flutter pub get

      - name: 🔨 Build APK Release
        working-directory: project
        run: |
          flutter build apk --release --no-tree-shake-icons
          echo ""
          echo "✅ APK berhasil dibuild:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk


      - name: 🏷️ Rename APK
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          cp project/build/app/outputs/flutter-apk/app-release.apk \
             "Tr4sflow-Executive-${DATE}.apk"
          echo "APK_FILE=Tr4sflow-Executive-${DATE}.apk" >> $GITHUB_ENV
          echo "✅ File: Tr4sflow-Executive-${DATE}.apk"

      - name: ⬆️ Upload APK ke Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📎 Upload sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tr4sflow-Executive-APK
          path: ${{ env.APK_FILE }}
          retention-days: 7
